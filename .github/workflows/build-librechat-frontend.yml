name: Build LibreChat Frontend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout LibreChat
        uses: actions/checkout@v4
        with:
          repository: LibreChat-AI/LibreChat
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run frontend:ci

      - name: Show build output
        run: find . -path ./node_modules -prune -o -name index.html -print

      - name: Upload frontend
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          if-no-files-found: warn
          path: |
            client/dist
