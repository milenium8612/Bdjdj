name: Build LibreChat Frontend

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout LibreChat
        uses: actions/checkout@v4
        with:
          repository: LibreChat-AI/LibreChat
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run frontend:ci

      - name: Remove sourcemaps
        run: find client/dist -name "*.map" -delete || true

      - name: Deploy dist to frontend-dist branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client/dist
          publish_branch: frontend-dist
          force_orphan: true
