name: build-nextchat
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Клонировать NextChat"
        run: git clone --depth 1 https://github.com/ChatGPTNextWeb/NextChat.git nextchat

      - name: "Патч: static export"
        working-directory: nextchat
        run: |
          rm -rf app/api
          cat > app/danger-config.d.ts <<'EOF'
          type DangerConfig = {
            needCode: boolean;
            hideUserApiKey: boolean;
            disableGPT4: boolean;
            hideBalanceQuery: boolean;
            disableFastLink: boolean;
            customModels: string;
            defaultModel: string;
            visionModels: string;
          };
          EOF
          cp -r "$GITHUB_WORKSPACE/public"/* ./public/

      - name: "Сборка"
        working-directory: nextchat
        run: |
          yarn install
          yarn mask && npx cross-env BUILD_MODE=export next build

      - name: "Артефакт для скачивания"
        uses: actions/upload-artifact@v4
        with:
          name: nextchat-site
          path: nextchat/out
